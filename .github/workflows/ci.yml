name: CI

# Runs the same checks the README documents as local dev commands (gofmt,
# go vet, go test — including internal/arch's layering gate — and the
# frontend's bun test/build) on every PR, so a layering violation or a
# ratchet regression fails here instead of only on whoever next happens to
# run `go test ./internal/arch/` by hand. build-prod.yml stays release-only
# (tags); nothing there gates a PR today.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: protobuf schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install pinned Buf CLI
        run: |
          mkdir -p "$RUNNER_TEMP/buf-bin"
          GOBIN="$RUNNER_TEMP/buf-bin" go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          echo "$RUNNER_TEMP/buf-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/buf-bin:$PATH"
          buf --version

      - name: Lint schema
        run: buf lint

      - name: Check protobuf formatting
        run: buf format --diff --exit-code

      - name: Test generator staging failure behavior
        run: scripts/test-buf-generate.sh

      - name: Generate Go and TypeScript bindings
        run: scripts/buf-generate.sh

      - name: Check generated files are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- internal/hostapi/gen frontend/src/generated/hostapi)" ]; then
            echo "::error::Generated protobuf files are stale; run 'task proto:generate' and commit the outputs."
            git status --short -- internal/hostapi/gen frontend/src/generated/hostapi
            exit 1
          fi

      - name: Compile generated Go package
        run: go test ./internal/hostapi/gen/...

      - name: Check breaking changes when a baseline module exists
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/buf-breaking.sh "$BASE_REF"

  go:
    name: go test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # internal/bridge, internal/app and the root `devkit` package import
      # wails3's cgo webview bindings, so even `go vet`/`go test ./...`
      # (never mind an actual desktop build) need the headers on PATH —
      # confirmed against build-prod.yml's Linux matrix leg, which installs
      # the same two packages for the real package build.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            bubblewrap

      # internal/sandbox's bwrap backend needs --unshare-user +
      # --unshare-net, which on Ubuntu 24.04 runs into AppArmor's
      # unprivileged-userns restriction (on by default on the ubuntu-24.04
      # runner image) — bwrap gets partway through and then fails setting up
      # the loopback interface with "Operation not permitted". Same fix
      # every other bwrap/Chromium-sandbox-on-CI report uses. The runner is
      # thrown away after the job, so loosening this here costs nothing.
      - name: Allow unprivileged user namespaces for bubblewrap
        # `|| true`: a runner image without this sysctl key at all (a future
        # image, a non-Ubuntu one) has nothing to loosen — that is not the
        # same failure as the key existing and the write being refused.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # main.go's `//go:embed all:frontend/dist` needs the directory to exist
      # and hold at least one file. A real UI is not needed to compile or run
      # Go tests — only build-prod.yml's release build ships one — so a stub
      # is enough here and skips a wails3/bun frontend build entirely.
      - name: Stub frontend/dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>stub</title>' > frontend/dist/index.html

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal main.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags server ./...

      # Covers internal/arch (TestLayering, TestNoImportCycles) along with
      # everything else — internal/arch is not special-cased in the README's
      # own command either.
      - name: go test
        run: go test ./internal/... ./cmd/... -count=1

      # The SDK control spikes are nested Go modules and are not reached by the
      # root-module package patterns above. Keep their test and vet gates explicit.
      - name: Test and vet standalone SDK spikes
        run: |
          set -e
          (cd tools/spikes/anthropic-sdk-control && go test ./... && go vet ./...)
          (cd tools/spikes/openai-sdk && go test ./... && go vet ./...)

  go-lint:
    name: golangci-lint
    # only-new-issues needs a PR to diff against; existing debt is real
    # (see .golangci.yml) and would fail a plain push-to-main run today.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint run --new-from-rev below needs the PR's base commit
          # reachable locally to diff against; the default shallow clone
          # only has this branch's own history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Stub frontend/dist for go:embed
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>stub</title>' > frontend/dist/index.html

      # Installed by hand rather than through golangci-lint-action, and
      # pinned to a version new enough to matter — three layered problems,
      # each measured against this exact go.mod:
      # - A downloaded binary release is built with whatever Go the
      #   golangci-lint maintainers last used — older than go.mod's
      #   `go 1.27.1`, which golangci-lint itself then refuses to run
      #   against ("the Go language version ... is lower than the targeted
      #   Go version"). Building from source is the fix in principle.
      # - `go install pkg@version` for a package outside the current module
      #   ignores this repo's go.mod entirely, so GOTOOLCHAIN=auto builds
      #   golangci-lint with whatever toolchain ITS OWN go.mod names — which
      #   for older golangci-lint releases is well under 1.27.1, right back
      #   to the same refusal. GOTOOLCHAIN pinned to the exact version below
      #   forces that build itself onto go1.27.1.
      # - Even built with go1.27.1, golangci-lint v2.5.0 cannot read
      #   go1.27.1's stdlib export data at all ("export data version 4 is
      #   greater than maximum supported version 2") — its vendored
      #   x/tools predates the format. v2.13.2 is the first version
      #   confirmed (measured locally) to both build clean under go1.27.1
      #   and type-check successfully against it.
      # - The action's own install-mode: goinstall hits the second problem
      #   AND constructs `go install .../golangci-lint/cmd/golangci-lint@…`
      #   — the v1 module path, missing the `/v2` a Go module needs for a
      #   major version >= 2 — failing outright regardless ("invalid
      #   version: unknown revision"). Installing by hand avoids that too.
      - name: Install golangci-lint
        run: |
          # Same version go.mod's `go` line names, not hardcoded here — a
          # future bump to go.mod is what GOTOOLCHAIN must follow.
          export GOTOOLCHAIN="go$(go list -m -f '{{.GoVersion}}')"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      # --new-from-rev replicates only-new-issues: only lines this PR's diff
      # actually touches are gated; .golangci.yml explains why (existing
      # debt is real but is not this gate's job to force fixed in one PR).
      # Scoped to ./internal/... ./cmd/..., same as the go test job and for
      # the same reason: the bare default (./...) also reaches build/ios and
      # the root package, both cgo/GTK scaffolding that AGENTS.md already
      # documents as an expected failure outside a real build.
      - name: golangci-lint run (new issues only)
        run: golangci-lint run --new-from-rev=${{ github.event.pull_request.base.sha }} ./internal/... ./cmd/...

  frontend:
    name: frontend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Includes moduleBoundaryRatchet.test.ts, designSystemConformance.test.ts,
      # smoothnessRatchet.test.ts and storeSubscriptionRatchet.test.ts — the
      # frontend's own version of internal/arch's layering gate.
      - run: bun run test

      # tsc (typecheck) + vite build + the bundle-size budget script. Needs no
      # wails3 CLI: frontend/bindings/ is generated output committed to the
      # repo, not regenerated at build time.
      - run: bun run build
