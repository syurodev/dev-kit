# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "dev-kit"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Local-first developer toolkit"
vendor: "SynX"
homepage: "https://github.com/syurodev/dev-kit"
license: "MIT"
release: "1"

contents:
  - src: "./bin/dev-kit"
    dst: "/usr/local/bin/dev-kit"
  # The CodeGraph analyzer, built by the `common:build:analyzer` task the
  # packaging depends on. <prefix>/share/dev-kit is where the app looks: the
  # binary is at <prefix>/bin, and installedResourcePaths in
  # internal/codegraph/artifact.go walks up one and across. Change one, change
  # the other.
  - src: "./analyzer/target/codegraph-analyzer.jar"
    dst: "/usr/local/share/dev-kit/codegraph-analyzer.jar"
  # The TypeScript analyzer, built by `common:build:analyzer:ts`. Same place
  # and the same rule: change one, change the other. Unlike the jar it needs
  # no runtime installed — it is a self-contained Go binary — so it is
  # executable rather than data.
  - src: "./analyzer-ts/bin/tsgo"
    dst: "/usr/local/share/dev-kit/tsgo"
    file_info:
      mode: 0755
  # The devkit-mcp stdio proxy, built by the `build:mcp` task the packaging
  # depends on. Beside dev-kit in /usr/local/bin: where ResolveCommand in
  # internal/mcp/install/install.go looks first (filepath.Dir(exe)).
  - src: "./bin/devkit-mcp"
    dst: "/usr/local/bin/devkit-mcp"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/dev-kit.png"
  - src: "./build/linux/dev-kit.desktop"
    dst: "/usr/share/applications/dev-kit.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
